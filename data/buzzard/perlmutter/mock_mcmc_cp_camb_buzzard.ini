; Fixed 1h-concentration redshift (estevesjh/y3_cluster_cpp#3, owner
; convention): c(M, z_halo) with z_halo from the ini; concentration-only
; -- tables stay comoving rho_m0. At 0.46 the measured effect was
; concentration -9.3% mean, Shear1hMisSel tilt -8.3% -> +2.3%; owner
; set 0.4 (survey mean; counts-weighted mean would be 0.46).
[halo_model]
z_halo = 0.4

; Per-mass NFW concentration in the projection profile
; (estevesjh/y3_cluster_cpp#13): Child18 c(M) at one_halo_z from
; haloModel/concentration, replacing the legacy fixed c=4. Measured
; (with one_halo_z=0.46): dsigma_prj radial tilt +12% (inner) -> -5%
; (outer) vs legacy. Requires compute_lensing_1h=T (inherited: T).
[shear_prj_frozen_physics]
use_halo_model_conc = T

[shear_prj]
use_halo_model_conc = T
