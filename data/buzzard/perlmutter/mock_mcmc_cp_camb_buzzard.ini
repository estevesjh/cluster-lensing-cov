; Buzzard-mock pipeline overrides (issues #1/#2 here +
; estevesjh/y3_cluster_cpp#8/#12).
;
; %includes the base pipeline and overrides ONLY what the Buzzard runs
; need (later keys win in the cosmosis Inifile parser). The base ini is
; left untouched because the widePlanck self-closure data vectors were
; generated with its settings and must keep matching their own model.
;
; OBSERVED-z BIN EDGES: the production Buzzard DV comes from Tan Xing's
; notebook (github.com/xtang126/mock_cluster_buzzard,
; MockDataVector.ipynb). Its code (cell 3, verified against upstream
; main on 2026-08-20) bins NC and the stacked DSigma on the scattered
; z_obs with
;     ZMIN_LIST = [0.20, 0.37, 0.50]
;     ZMAX_LIST = [0.33, 0.50, 0.65]
; and her shipped products store those edges as DATA
; (output/MockDataVector*.npz: z_bin_min=[0.2,0.37,0.5],
; z_bin_max=[0.33,0.5,0.65]) -- i.e. the box seam [0.33, 0.37) is
; EXCLUDED from the observed bins,
; and the seam halos themselves are dropped from the catalog (true-z
; cut, notebook cell 4/5). NOTE the notebook's own markdown header
; ("z in {0.20, 0.35, 0.50, 0.65}") is stale vs its code, and
; validations/build_buzzard_datavector.py in THIS repo uses 0.35 edges
; -- it is NOT the production DV path; do not take binning conventions
; from it.
;
; Overridden here: sel_function zob edges, b_sel_marg zo walls, bsel
; bin centres, the 120-point zo walls of all three shear_prj variants.
; Still open on the code side (estevesjh/y3_cluster_cpp#8): TRUE-z seam
; excision -- halos with z_true in [0.33, 0.37] are absent from the
; catalog but the model still integrates S_j through that range (edge
; leakage of order sigma_z ~ 0.01(1+z) around the seam), and Omega(z)
; is still the hardcoded Y1-SPT footprint.
;
; Default data vector: the h-unit-fixed Buzzard DV. Run scripts may
; override likelihoods.filename as usual.

%include ${DES_CLUSTER_NERSC_DIR}/cosmosis-models/mock_mcmc_cp_camb.ini

; Buzzard-truth starts (incl. Tan Xing's exact HOD constants -- notably
; epsilon = 0.2839, which the widePlanck file zeroes for its own
; self-closure DVs -- and z_pivot = 0.4544). Priors unchanged.
[pipeline]
values = ${DES_CLUSTER_NERSC_DIR}/cosmosis-models/mock_mcmc_buzzard_values.ini

[likelihoods]
filename = ${DES_CLUSTER_NERSC_DIR}/data/mock/dv_buzzard_jkcov_hfix.npz

; Dense distances/P(k) z-grid (estevesjh/y3_cluster_cpp#12): nz=50's
; piecewise-linear chi has a -1.4% local-slope z-sawtooth that distorts
; the exclusion-ring geometry of the whole projection chain (shear_prj
; cl channel moves up to 1.7% end-to-end at nz=400). Safe to fix here:
; the Buzzard DV is measured from the sim, not model-closed.
[cp_camb]
nz = 400

; 12 (lambda, zob) bins: 4 richness x 3 zob, zob edges per the
; xtang126 notebook (seam-excluding). zt_excl_*: the mock also DROPS
; every halo with z_true in the box seam from counts and stacks
; (notebook cells 4-5) -- excise the same interval from the model's
; true-z integration (y3_cluster_cpp#8; S_stack consumers inherit it).
[sel_function]
zob_min = 0.20 0.20 0.20 0.20 0.37 0.37 0.37 0.37 0.50 0.50 0.50 0.50
zob_max = 0.33 0.33 0.33 0.33 0.50 0.50 0.50 0.50 0.65 0.65 0.65 0.65
zt_excl_low  = 0.33
zt_excl_high = 0.37

[b_sel_marg]
zo_low     = 0.20 0.20 0.20 0.20 0.37 0.37 0.37 0.37 0.50 0.50 0.50 0.50
zo_high    = 0.33 0.33 0.33 0.33 0.50 0.50 0.50 0.50 0.65 0.65 0.65 0.65

; bsel evaluates b_sel(theta) at the observed-bin centres.
[bsel]
zob = 0.265 0.435 0.575

