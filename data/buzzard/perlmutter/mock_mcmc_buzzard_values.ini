; Buzzard-truth values file (issue #3 / y3_cluster_cpp#3 follow-up).
;
; Same priors as mock_mcmc_widePlanck_values.ini; only the START values
; differ -- set to the Buzzard SIMULATION truth so pre-flight (test
; sampler) runs evaluate the model at the mock's actual parameters:
;
;   cosmology: DeRose+2019 Table 1 (Om=0.286, s8=0.82, h=0.70,
;              ns=0.96, Ob=0.047)
;   HOD:       Tan Xing's EXACT constants
;              (xtang126/mock_cluster_buzzard src/costanzi_selection.py:
;               log10_Mmin=11.3852818, log10_M1=12.6964410 ->
;               log10_ratio=1.3111592, alpha=0.858693714,
;               sigma_intr=0.180949022, epsilon=0.283887020,
;               z_pivot=0.4544).
;
; The widePlanck file deliberately keeps epsilon start = 0.0 and rounded
; HOD starts: its SELF-CLOSURE data vectors were generated with those
; values, and changing them there would silently break closure. The
; owner-requested epsilon fix therefore lives HERE, in the file the
; Buzzard override ini uses.

[cosmological_parameters]
; min     start      max
h0        = 0.473  0.70       0.873
omega_m   = 0.11   0.286      1.0
omega_b   = 0.02   0.047      0.10
omega_k   = 0.0
tau       = 0.0544
n_s       = 0.8    0.96       1.15
sigma8    = 0.5    0.82       1.5
w         = -1.0
wa        = 0.0
mnu       = 0.0
num_massive_neutrinos = 0
nnu       = 3.046
neutrino_hierarchy    = 0

[cluster_abundance]
hmf_s = 0.0
hmf_q = 1.0

[cluster_mor]
; min   start        max
log10_Mmin   = 10.0  11.3852818   13.0
log10_ratio  = 1.0   1.3111592    1.5
alpha        = 0.4   0.858693714  1.4
epsilon      = -1.0  0.283887020  1.0
sigma_lambda = 0.05  0.180949022  0.50
; fixed: the mock's pivot (Costanzi Eq. 15); code default is 0.45.
z_pivot      = 0.4544

[photoz]
delta_z = 0.0

; Miscentering (read by Shear1hMisSel/DSigma1hMisSel via the datablock
; "miscentering" section; see y3_cluster_cpp#15). Miscentering is a DES
; redMaPPer effect (offset between the observed center and the true halo);
; BUZZARD clusters sit on the true halo centers, so there is NO miscentering
; here -> f_mis = 0. (DES-data fiducial would be f_mis=0.22, tau_mis=0.17.)
[miscentering]
f_mis   = 0.0
tau_mis = 0.17
